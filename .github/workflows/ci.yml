name: CI - Build and Smoke Test

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform images)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        run: |
          docker build -f backend/Dockerfile -t simple_calculator_backend:ci .

      - name: Run backend container
        run: |
          docker run -d --rm --name backend-ci -p 8000:8000 simple_calculator_backend:ci

      - name: Wait for backend /docs to be available
        run: |
          for i in {1..15}; do
            if curl -sSf http://localhost:8000/docs >/dev/null; then echo "backend ready"; exit 0; fi
            sleep 2
          done
          echo "backend did not become ready in time"
          docker logs backend-ci || true
          exit 1

      - name: Backend smoke test (POST /calc)
        run: |
          set -e
          RESP=$(curl -s -X POST -H "Content-Type: application/json" -d '{"a":2,"b":3,"op":"add"}' http://localhost:8000/calc || true)
          echo "Response: $RESP"
          echo "$RESP" | grep -q '"result"' || (echo "No result field in response" && exit 1)

      - name: Stop backend container
        if: always()
        run: |
          docker stop backend-ci || true

      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile --build-arg VITE_API_URL=http://backend:8000 -t simple_calculator_frontend:ci .

      - name: Run frontend container
        run: |
          docker run -d --rm --name frontend-ci -p 5173:80 simple_calculator_frontend:ci

      - name: Wait for frontend to be available
        run: |
          for i in {1..15}; do
            if curl -sSf http://localhost:5173 >/dev/null; then echo "frontend ready"; exit 0; fi
            sleep 2
          done
          echo "frontend did not become ready in time"
          docker logs frontend-ci || true
          exit 1

      - name: Stop frontend container
        if: always()
        run: |
          docker stop frontend-ci || true
